name: Tourism Package Prediction ML pipeline

on:
  push:
    branches:
      - main

jobs:

  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt

      - name: Upload dataset to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.TPP_HF_TOKEN }}
        run: python tourism_project/model_building/data_register.py


  data-prep:
    runs-on: ubuntu-latest
    needs: register-dataset
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt

      - name: Run data preparation
        env:
          HF_TOKEN: ${{ secrets.TPP_HF_TOKEN }}
        run: python tourism_project/model_building/prep.py


  model-training:
    runs-on: ubuntu-latest
    needs: data-prep
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt

      - name: Train model and save to Hub
        env:
          HF_TOKEN: ${{ secrets.TPP_HF_TOKEN }}
        run: python tourism_project/model_building/train.py


  deploy-hosting:
    runs-on: ubuntu-latest
    needs: [model-training]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt

      - name: Push files to Hugging Face Space (Frontend)
        env:
          HF_TOKEN: ${{ secrets.TPP_HF_TOKEN }}
        run: python tourism_project/hosting/hosting.py
